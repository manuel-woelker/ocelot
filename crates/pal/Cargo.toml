[package]
name = "ocelot-pal"
version = "0.1.1"
edition = "2024"
description = "Platform abstraction layer for the ocelot project"
license = "MIT"
repository = "https://github.com/manuel-woelker/ocelot"

[dependencies]
ocelot-base = { path = "../base", version = "0.1.1" }
expect-test = { workspace = true }
ignore = { workspace = true }
notify-debouncer-full = { workspace = true }
relative-path = { workspace = true }
tokio = { version = "1.44.2", features = ["io-util", "macros", "process", "rt-multi-thread", "sync"] }
