name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl -p ocelot --locked

      - name: Build GNU native runtime
        run: cargo build --release --target x86_64-unknown-linux-gnu -p ocelot-native-runtime --locked

      - name: Verify native compilation
        run: |
          ./t tcc -v
          cargo build --workspace --locked
          cargo run -p ocelot-spec-validation -- --backend=all

      - name: Package release artifacts
        env:
          TAG_NAME: ${{ github.ref_name }}
          TARGET_TRIPLE: x86_64-unknown-linux-musl
        run: |
          set -euo pipefail
          ARCHIVE_BASENAME="ocelot-${TAG_NAME}-${TARGET_TRIPLE}"
          ARTIFACT_DIR="dist/${ARCHIVE_BASENAME}"

          mkdir -p "${ARTIFACT_DIR}"
          cp "target/${TARGET_TRIPLE}/release/ocelot" "${ARTIFACT_DIR}/ocelot"
          cp README.md "${ARTIFACT_DIR}/README.md"
          cp target/x86_64-unknown-linux-gnu/release/libocelot_native_runtime.a "${ARTIFACT_DIR}/libocelot_native_runtime.a"
          cp docs/NATIVE.md "${ARTIFACT_DIR}/NATIVE.md"

          "${ARTIFACT_DIR}/ocelot" build examples/native-smoke.ocelot-script -o "${ARTIFACT_DIR}/native-smoke"
          "${ARTIFACT_DIR}/native-smoke"
          rm -- "${ARTIFACT_DIR}/native-smoke"

          tar -C dist -czf "dist/${ARCHIVE_BASENAME}.tar.gz" "${ARCHIVE_BASENAME}"
          sha256sum "dist/${ARCHIVE_BASENAME}.tar.gz" > "dist/${ARCHIVE_BASENAME}.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
